[project]
name = "replayable"
version = "0.1.0"
description = "Deterministic record/replay harness for containerized agent workloads."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44.0.0",
    "httpx>=0.28.1",
    "mitmproxy>=12.2.3",
    "pytest>=9.1.1",
    "typer>=0.26.8",
]

[project.scripts]
replayable = "replayable.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
markers = [
    "e2e: Docker and network-backed end-to-end acceptance tests",
]
