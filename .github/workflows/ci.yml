name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

      # The correctness kernel: modules where a silent bug would corrupt a
      # recording or serve the wrong recorded response. Held at 90% branch
      # coverage.
      - name: Cassette and redaction branch coverage
        run: >-
          uv run pytest tests/test_cassette.py tests/test_events.py tests/test_redact.py
          --cov=replayable.cassette --cov=replayable.redact --cov-branch
          --cov-report=term --cov-fail-under=90
      - name: Matcher branch coverage
        run: >-
          uv run pytest tests/test_matcher.py
          --cov=replayable.matcher --cov-branch
          --cov-report=term --cov-fail-under=90

  dashboard:
    name: Dashboard build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - name: Verify packaged assets are current
        run: git diff --exit-code -- ../src/replayable/ui_static
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
        working-directory: .
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  e2e:
    name: Docker end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked

      - name: Generate a replay CA
        # Deliberately not mitmproxy's own generated CA: it backdates validity
        # by only two days. The replay addon separately pins generated leaf
        # validity to cassette t0; both halves are needed for old cassettes.
        # See scripts/make_replay_ca.py for the full reasoning.
        run: uv run python scripts/make_replay_ca.py --not-before-days 3650 --force

      - name: Diagnose the runner
        run: uv run replayable doctor

      - run: docker build -t replayable/agent-base:local images/agent-base

      - name: End-to-end acceptance tests
        run: uv run pytest tests/e2e -v
        env:
          REPLAYABLE_RUN_E2E: "1"
